name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (no embedded engines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features

  ladybug:
    name: build and test with Ladybug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  neo4j:
    name: fuzz Ladybug against Neo4j
    runs-on: ubuntu-latest
    needs: ladybug
    services:
      neo4j:
        image: neo4j:2026.10-community
        env:
          NEO4J_AUTH: neo4j/graphfuzz123
        ports:
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Short run (DuckGQL is skipped without its feature)
        run: |
          sed -e 's/^  isolate: 6/  isolate: 1/' -e 's/^  compare: 1000/  compare: 100/' \
              -e 's/^  explore: 400/  explore: 0/' -e 's/^  grammar: true/  grammar: false/' \
              -e 's/^  reduce: true/  reduce: false/' config.yml > ci.yml
          ./target/release/graphfuzz run --config ci.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: runs/latest/
