# graphfuzz run configuration. Every setting is optional; the values below are the defaults.
# Run with: graphfuzz run --config config.yml

# The seed decides the fixture data and every generated query, so a run can be repeated exactly.
seed: 1

# Where report.md and results.jsonl go, relative to this file.
out: runs/latest

# How long one statement may run before it is interrupted (milliseconds).
timeout_ms: 10000

# The graph every engine loads: node and edge types and their typed properties. Types are INT64, FLOAT64,
# STRING, BOOL, DATE, LOCAL DATETIME, ZONED DATETIME, and DECIMAL; add NOT NULL for a required property.
# Every node type needs `id: INT64 NOT NULL`, by which the fixture finds nodes. `count` is how many nodes of a
# type the fixture has; each edge type gets about twice its source type's count. Undirected edge types are
# used only by DuckGQL's GQL-only exploration. DuckGQL keeps one property name to one type across node types.
schema:
  nodes:
    Person:
      count: 12
      properties: {id: INT64 NOT NULL, name: STRING, age: INT64, score: FLOAT64, active: BOOL, born: DATE, joined: LOCAL DATETIME, seen: ZONED DATETIME, balance: DECIMAL}
    City:
      count: 5
      properties: {id: INT64 NOT NULL, name: STRING, population: INT64, established: DATE}
    Company:
      count: 4
      properties: {id: INT64 NOT NULL, name: STRING, founded: INT64, revenue: DECIMAL}
  edges:
    KNOWS: {from: Person, to: Person, properties: {since: INT64, weight: FLOAT64, met: DATE}}
    LIVES_IN: {from: Person, to: City, properties: {since: INT64}}
    WORKS_AT: {from: Person, to: Company, properties: {since: INT64, role: STRING, started: LOCAL DATETIME}}
    LOCATED_IN: {from: Company, to: City}
    NEAR: {from: City, to: City, undirected: true, properties: {km: INT64}}

# The engine every other engine is compared against. Remove it to check each engine against itself only.
reference: neo4j

# Each engine: a connector (how to reach it) and a dialect (how to write queries for it). A dialect is a
# built-in profile (gql, cypher25, opencypher; see profiles/) or a profile file. `supported` and
# `unsupported` adjust the profile's feature list for this engine; `syntax` overrides its syntax settings.
engines:
  neo4j:
    connector: neo4j_http
    dialect: cypher25
    url: http://localhost:7474
    user: neo4j
    password: graphfuzz123
    # Loading the fixture deletes everything in the database.
    allow_wipe: true

  duckgql:
    connector: duckgql          # the DuckGQL libduckdb that .cargo/config.toml links
    dialect: gql
    # Also check answers against rewrites that must not change them.
    metamorphic: true

  ladybug:
    connector: ladybug          # embedded, through the lbug crate
    dialect: opencypher
    path: runs/ladybug.lbdb     # recreated at the start of every run
    supported: [label_or, exists_match]
    syntax:
      # Ladybug has no localdatetime() or datetime(); it has TIMESTAMP and TIMESTAMP_TZ.
      literals: {local_datetime: "timestamp('{}')", zoned_datetime: "CAST('{}' AS TIMESTAMP_TZ)"}

  # Amazon Neptune, or any endpoint that takes form-encoded openCypher over HTTP. It has no transactions,
  # so data-modifying cases are skipped. IAM-authenticated clusters need a signing proxy (headers can carry
  # other credentials).
  # neptune:
  #   connector: opencypher_http
  #   dialect: opencypher
  #   url: https://my-cluster.cluster-xxxx.us-east-1.neptune.amazonaws.com:8182/openCypher
  #   headers: {}
  #   allow_wipe: false         # must be true to load the fixture, which deletes all data
  #   enabled: false

phases:
  # Queries per feature with only that feature on, over a fixed base query.
  isolate: 6
  # The features (or groups) to isolate; empty means all of them.
  isolate_features: []
  # Random queries both engines must answer the same.
  compare: 1000
  # Random queries that may use GQL-only features, checked on DuckGQL alone.
  explore: 400
  # Run the configured grammars' systematic sentences (see grammars: below).
  grammar: true

generator:
  # The share of random queries that modify data (run in a transaction that is rolled back).
  mutation_share: 0.15

  # Multiplies how often a feature, or every feature of a group, is used; 0 turns it off.
  # A feature's own weight overrides its group's. `graphfuzz features` lists both.
  weights: {}
  #   optional_match: 5
  #   paths: 3
  #   aggregates: 2
  #   quant_star: 0

  # Features or groups to use wherever the generator can.
  focus: []
  #   - quant_range

  # Features or groups never to use.
  disable: []
  #   - return_star

checks:
  # Rewrites that must not change an answer: partitioning a filter, reversing paths, count(*), DISTINCT.
  metamorphic: true
  # Shrink one failing case per failure group to a minimal query.
  reduce: true
  # Variants tried per reduction.
  reduce_budget: 150

# Grammars whose every choice is tried: each alternative of each rule, each optional element present and
# absent, each repetition 0, 1, and 2 times, and with `coverage: pairs` each alternative of every rule an
# alternative uses. Each choice gets the shortest sentence that makes it, run in a rolled-back transaction.
grammars:
  gql:
    file: grammars/gql/GQL.g4         # OpenGQL's ANTLR grammar for ISO/IEC 39075, as DuckGQL vendors it
    start: gqlProgram
    coverage: pairs
    engines: [duckgql]
    # Default to MATCH ... RETURN with integer literals, so sentences exercise queries rather than DELETE.
    prefer:
      statement: 0                      # compositeQueryStatement
      linearQueryStatement: 1           # ambientLinearQueryStatement
      ambientLinearQueryStatement: 0
      primitiveResultStatement: 0       # RETURN
      primitiveQueryStatement: 0        # MATCH
      valueExpression: 14               # primaryExprAlt
      valueExpressionPrimary: 2         # unsignedValueSpecification
      nonParenthesizedValueExpressionPrimarySpecialCase: 1
      unsignedValueSpecification: 0
      unsignedLiteral: 0
      unsignedNumericLiteral: 0
      exactNumericLiteral: 4            # an unsigned integer
    vocabulary:
      bindingVariable: [n, m, e, p]
      labelName: [Person, City, KNOWS, LIVES_IN]
      propertyName: [id, name, age, since]
      fieldName: [id, name]
      graphName: [fuzz]
      graphTypeName: [fuzz_type]
      nodeTypeName: [Person]
      edgeTypeName: [KNOWS]
      schemaName: [main]
      directoryName: [main]
      objectName: [fuzz]
      objectNameOrBindingVariable: [n]
      bindingTableName: [t]
      procedureName: [shortest_path]
      subpathVariable: [q]
      localNodeTypeAlias: [Person]
      sourceNodeTypeAlias: [Person]
      destinationNodeTypeAlias: [Person]
      regularIdentifier: [x]
      SINGLE_QUOTED_CHARACTER_SEQUENCE: ["'Ada'"]
      DOUBLE_QUOTED_CHARACTER_SEQUENCE: ['"Ada"']
      ACCENT_QUOTED_CHARACTER_SEQUENCE: ['`Ada`']
      UNSIGNED_DECIMAL_INTEGER: ["1", "2"]

  opencypher:
    file: grammars/opencypher/Cypher.g4   # openCypher 9 (M23), from artifacts.opencypher.org
    start: oC_Cypher
    separator: auto                     # a space only where tokens would run together; SP spells the rest
    coverage: pairs
    engines: [neo4j, ladybug]
    prefer:
      oC_SinglePartQuery: 0             # RETURN, not DELETE, when nothing forces a clause
    vocabulary:
      SP: [" "]
      oC_Variable: [n, m, e, p]
      oC_LabelName: [Person, City]
      oC_RelTypeName: [KNOWS, LIVES_IN]
      oC_PropertyKeyName: [id, name, age, since]
      oC_FunctionName: [abs, toUpper, size, coalesce]
      oC_ProcedureName: [db.labels]
      oC_SymbolicName: [x]
      StringLiteral: ["'Ada'"]
      DecimalInteger: ["1", "2"]
