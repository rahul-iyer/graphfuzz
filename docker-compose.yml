# Neo4j for graphfuzz's reference engine: docker compose up -d
# The password matches config.yml; change both, or leave it out of config.yml and set NEO4J_PASSWORD.
services:
  neo4j:
    image: neo4j:2026.10-community
    container_name: graphfuzz-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-graphfuzz123}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
